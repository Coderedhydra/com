<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Viewer</title>
    <link id="pageStyle" rel="stylesheet" href="{{ url_for('static', filename='comic/page.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='comic/bubble.css') }}">

    <script src="{{ url_for('static', filename='comic/page.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="{{ url_for('static', filename='comic/page_place.js') }}"></script>

</head>

<body>
    <div class="button">
        <button onclick="prevPage()"><img src="{{ url_for('static', filename='comic/assets/backward.png') }}" alt="Previous"></button>
        <button onclick="printPage()" style="margin: 0 10px; padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">Print Page (HQ)</button>
        <button onclick="exportServerSideHQ()" style="margin: 0 10px; padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">Export Ultra HQ</button>
        <button onclick="printAllPages()" style="margin: 0 10px; padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">Print All</button>
        <button onclick="uploadImage()" style="margin: 0 10px; padding: 10px 20px; background-color: #ffc107; color: black; border: none; border-radius: 5px; cursor: pointer;">Upload Image</button>
        <button onclick="nextPage()"><img src="{{ url_for('static', filename='comic/assets/forward.png') }}" alt="Next"></button>
    </div>
    
    <!-- Hidden file input for image upload -->
    <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">

    <div class="wrapper">
        <div class="grid-container">
            <div class="grid-item" id="_1"></div>
            <div class="grid-item" id="_2"></div>
        </div>
    </div>

</body>

</html>
