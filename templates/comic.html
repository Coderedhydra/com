<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amit Comic Viewer</title>
    <link id="pageStyle" rel="stylesheet" href="{{ url_for('static', filename='comic/page.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='comic/bubble.css') }}">
    <style>
        /* Centered comic layout with 95% fit and 5% gap */
        body {
            margin: 0 !important;
            padding: 2.5% !important;
            background: #f0f0f0 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            min-height: 100vh !important;
            box-sizing: border-box !important;
        }
        .button {
            margin-bottom: 2.5% !important;
        }
        .wrapper {
            width: 95vw !important;
            height: 95vh !important;
            max-width: 800px !important;
            max-height: 1080px !important;
            margin: 0 auto !important;
            padding: 0 !important;
            border: 2px solid #333 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2) !important;
            border-radius: 5px !important;
            background: #ffffff !important;
            box-sizing: border-box !important;
        }
        .grid-container {
            width: 100% !important;
            height: 100% !important;
            display: grid !important;
            grid-template-columns: 1fr 2px 1fr !important;
            grid-template-rows: 1fr 2px 1fr !important;
            gap: 0px !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            box-sizing: border-box !important;
            background: #ffffff !important;
        }
        .grid-item {
            width: 100% !important;
            height: 100% !important;
            background-size: contain !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
            border-radius: 0px !important;
            box-shadow: none !important;
            outline: none !important;
            box-sizing: border-box !important;
            background-color: #f8f9fa !important;
            image-rendering: -webkit-optimize-contrast !important;
            image-rendering: crisp-edges !important;
            image-rendering: pixelated !important;
        }
        #_1 { grid-column: 1; grid-row: 1; }
        #_2 { grid-column: 3; grid-row: 1; }
        #_3 { grid-column: 1; grid-row: 3; }
        #_4 { grid-column: 3; grid-row: 3; }
        .white-strip.vertical { grid-column: 2; grid-row: 1 / 4; background: #ffffff; }
        .white-strip.horizontal { grid-column: 1 / 4; grid-row: 2; background: #ffffff; }
    </style>

    <script src="{{ url_for('static', filename='comic/page.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="{{ url_for('static', filename='comic/page_place.js') }}"></script>

</head>

<body>
    <div class="button">
        <button onclick="prevPage()"><img src="{{ url_for('static', filename='comic/assets/backward.png') }}" alt="Previous"></button>
        <button onclick="printPage()" style="margin: 0 5px; padding: 6px 12px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px;">Print</button>
        <button onclick="exportServerSideHQ()" style="margin: 0 5px; padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px;">Export HQ</button>
        <button onclick="printAllPages()" style="margin: 0 5px; padding: 6px 12px; background-color: #28a745; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px;">Print All</button>
        <button onclick="showStorySummary()" style="margin: 0 5px; padding: 6px 12px; background-color: #6f42c1; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px;">Summary</button>
        <button onclick="generateFullComic()" style="margin: 0 5px; padding: 6px 12px; background-color: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px;">Full Comic</button>
        <button onclick="uploadImage()" style="margin: 0 5px; padding: 6px 12px; background-color: #ffc107; color: black; border: none; border-radius: 3px; cursor: pointer; font-size: 12px;">Upload</button>
        <button onclick="nextPage()"><img src="{{ url_for('static', filename='comic/assets/forward.png') }}" alt="Next"></button>
    </div>
    
    <!-- Hidden file input for image upload -->
    <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">

    <div class="wrapper">
        <div class="grid-container">
            <div class="grid-item" id="_1"></div>
            <div class="grid-item" id="_2"></div>
            <div class="grid-item" id="_3"></div>
            <div class="grid-item" id="_4"></div>
            <div class="white-strip vertical"></div>
            <div class="white-strip horizontal"></div>
        </div>
    </div>

</body>

</html>
