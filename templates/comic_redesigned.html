<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image-Focused Comic Viewer</title>
    <style>
        /* Image-Focused Template - Redesigned for Images */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        /* Floating controls */
        .controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }
        
        .controls button {
            background: #3498db;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .controls button:hover {
            background: #2980b9;
            transform: translateY(-1px);
        }
        
        .controls .generate-btn {
            background: #e74c3c;
        }
        
        .controls .generate-btn:hover {
            background: #c0392b;
        }
        
        /* Perfect image container - designed for images */
        .image-comic-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2c3e50;
        }
        
        /* Image-optimized square grid - NO GAPS */
        .image-grid {
            width: min(90vw, 90vh);
            height: min(90vw, 90vh);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            background: white;
            border-radius: 8px;
            padding: 0;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        }
        
        /* Perfect image panels - optimized for image display */
        .image-panel {
            background-color: #ecf0f1;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            
            /* Optimized image rendering */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: high-quality;
            
            /* Smooth hover effect */
            transition: transform 0.2s ease;
        }
        
        .image-panel:hover {
            transform: scale(1.01);
            z-index: 5;
        }
        
        /* Grid positioning */
        #_1 { grid-area: 1 / 1; }
        #_2 { grid-area: 1 / 2; }
        #_3 { grid-area: 2 / 1; }
        #_4 { grid-area: 2 / 2; }
        
        /* Image-optimized speech bubbles */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #2c3e50;
            border-radius: 18px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            z-index: 100;
            cursor: grab;
            user-select: none;
            box-shadow: 0 3px 12px rgba(0,0,0,0.3);
            max-width: 160px;
            word-wrap: break-word;
            backdrop-filter: blur(3px);
        }
        
        .bubble:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        
        .bubble.dragging {
            cursor: grabbing;
            z-index: 200;
            transform: scale(1.03);
        }
        
        /* Quality indicator */
        .quality-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            .controls {
                padding: 6px 12px;
                gap: 6px;
            }
            
            .controls button {
                padding: 5px 10px;
                font-size: 10px;
            }
            
            .image-grid {
                width: 95vw;
                height: 95vw;
            }
        }
    </style>
    
    <script src="{{ url_for('static', filename='comic/page.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="{{ url_for('static', filename='comic/page_place.js') }}"></script>
</head>

<body>
    <!-- Floating Controls -->
    <div class="controls">
        <button onclick="prevPage()">◀</button>
        <button onclick="printPage()">Print</button>
        <button onclick="exportServerSideHQ()">Export</button>
        <button onclick="showStorySummary()">Summary</button>
        <button onclick="generateFullComic()" class="generate-btn">Generate 12</button>
        <button onclick="uploadImage()">Upload</button>
        <button onclick="nextPage()">▶</button>
    </div>
    
    <!-- Quality Badge -->
    <div class="quality-badge">
        High Quality
    </div>
    
    <!-- Hidden file input -->
    <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
    
    <!-- Main Image-Focused Container -->
    <div class="image-comic-container">
        <div class="image-grid">
            <div class="image-panel" id="_1"></div>
            <div class="image-panel" id="_2"></div>
            <div class="image-panel" id="_3"></div>
            <div class="image-panel" id="_4"></div>
        </div>
    </div>
    
    <script>
        // Image-focused JavaScript
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🖼️ Image-focused comic template loaded');
            
            // Update grid items to use image-panel class
            const gridItems = document.querySelectorAll('.image-panel');
            gridItems.forEach((item, index) => {
                item.classList.add('grid-item'); // Add compatibility
                console.log(`📸 Image panel ${index + 1} ready`);
            });
            
            // Initialize with first page
            if (typeof pages !== 'undefined' && pages.length > 0) {
                placeDialogs(pages[current_page || 0]);
            }
        });
        
        // Enhanced image loading
        function loadHighQualityImage(element, imageSrc) {
            const img = new Image();
            img.onload = function() {
                element.style.backgroundImage = `url("${imageSrc}")`;
                element.style.opacity = '1';
                console.log(`🖼️ High quality image loaded: ${imageSrc}`);
            };
            img.onerror = function() {
                console.error(`❌ Failed to load: ${imageSrc}`);
                element.style.backgroundColor = '#e74c3c';
            };
            img.src = imageSrc;
        }
    </script>
</body>
</html>
